name: 每日资讯简报

on:
  schedule:
    # GitHub cron 用 UTC。1:30 UTC = 北京时间 9:30。
    # 注意：GitHub 定时任务在高峰期可能延迟几分钟到几十分钟，属正常现象。
    - cron: '30 1 * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write          # 允许推送生成的简报 commit

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成简报
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_MODEL: ${{ vars.ZHIPU_MODEL || 'glm-4.7' }}
        run: node scripts/generate-briefing.mjs

      - name: 提交并推送
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefing-data.js daily-briefing/
          if git diff --cached --quiet; then
            echo "简报无变化，跳过提交"
          else
            git commit -m "📰 每日资讯 ${BRIEF_DATE}"
            git push
          fi
